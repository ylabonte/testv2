<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vier Gewinnt - Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #info-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 2.5em;
        }
        #status {
            font-size: 1.2em;
            margin: 10px 0;
            color: #555;
            font-weight: bold;
        }
        #reset-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        #reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .player-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin: 0 5px;
            vertical-align: middle;
        }
        .player1 { background: #FF6B6B; }
        .player2 { background: #FFD93D; }
        
        /* Mock board */
        #board-preview {
            background: #2C3E50;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .board-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .board-row:last-child {
            margin-bottom: 0;
        }
        .cell {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #ECF0F1;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        .cell.red {
            background: #FF6B6B;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .cell.yellow {
            background: #FFD93D;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .note {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            color: #666;
            font-size: 0.9em;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="info-panel">
            <h1>🎮 Vier Gewinnt 🎮</h1>
            <div id="status"><span class="player-indicator player1"></span> Spieler 1 ist am Zug</div>
            <button id="reset-btn">Neues Spiel</button>
        </div>
        <div id="board-preview">
            <div class="board-row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div class="board-row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div class="board-row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell red"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div class="board-row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell red"></div>
                <div class="cell yellow"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div class="board-row">
                <div class="cell"></div>
                <div class="cell red"></div>
                <div class="cell yellow"></div>
                <div class="cell red"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div class="board-row">
                <div class="cell red"></div>
                <div class="cell yellow"></div>
                <div class="cell red"></div>
                <div class="cell yellow"></div>
                <div class="cell yellow"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
        </div>
        <div class="note">
            <strong>✨ Preview:</strong> Dies ist eine statische Vorschau des Spiels. Die echte Version verwendet p5.js für animierte Spielsteine, Hover-Effekte, fallende Animationen und Gewinn-Highlights. Das Spiel wird automatisch über GitHub Pages veröffentlicht.
        </div>
    </div>
</body>
</html>
