<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vier Gewinnt - Connect Four</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #info-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 2.5em;
        }
        #status {
            font-size: 1.2em;
            margin: 10px 0;
            color: #555;
            font-weight: bold;
        }
        #reset-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        #reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        #reset-btn:active {
            transform: translateY(0);
        }
        .player-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin: 0 5px;
            vertical-align: middle;
        }
        .player1 { background: #FF6B6B; }
        .player2 { background: #FFD93D; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="info-panel">
            <h1>🎮 Vier Gewinnt 🎮</h1>
            <div id="status">Spieler 1 ist am Zug</div>
            <button id="reset-btn" onclick="resetGame()">Neues Spiel</button>
        </div>
        <div id="canvas-container"></div>
    </div>
    <script src="game.js"></script>
</body>
</html>
